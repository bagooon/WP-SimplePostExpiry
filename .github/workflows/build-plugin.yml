name: Build plugin ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate version consistency
        shell: bash
        run: |
          set -euo pipefail

          plugin_version="$(sed -nE 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*$/\1/p' src/simple-post-expiry.php | head -n 1)"
          constant_version="$(sed -nE "s/^[[:space:]]*const[[:space:]]+VERSION[[:space:]]*=[[:space:]]*'([^']+)';.*$/\1/p" src/simple-post-expiry.php | head -n 1)"
          stable_version="$(sed -nE 's/^Stable tag:[[:space:]]*([^[:space:]]+).*$/\1/p' src/readme.txt | head -n 1)"

          if [[ -z "$plugin_version" || -z "$constant_version" || -z "$stable_version" ]]; then
            echo "::error title=Version not found::Could not read all three source version values."
            exit 1
          fi

          if [[ "$plugin_version" != "$constant_version" || "$plugin_version" != "$stable_version" ]]; then
            echo "::error title=Source version mismatch::Plugin header=$plugin_version, VERSION constant=$constant_version, Stable tag=$stable_version"
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"

            if [[ "$tag_version" != "$plugin_version" ]]; then
              echo "::error title=Tag version mismatch::Git tag=$GITHUB_REF_NAME, source version=$plugin_version"
              exit 1
            fi
          fi

          echo "Version consistency validated: $plugin_version"

      - name: Validate plugin
        run: |
          php -l src/simple-post-expiry.php
          php -l tests/run.php
          php tests/run.php
          node --check src/assets/admin.js

      - name: Build installable ZIP
        run: |
          set -euo pipefail
          mkdir -p build/simple-post-expiry
          cp -R src/. build/simple-post-expiry/
          cp LICENSE build/simple-post-expiry/LICENSE
          cd build
          zip -r ../simple-post-expiry.zip simple-post-expiry

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-post-expiry-${{ github.sha }}
          path: simple-post-expiry.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged plugin
        uses: actions/download-artifact@v4
        with:
          name: simple-post-expiry-${{ github.sha }}

      - name: Publish ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" simple-post-expiry.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" simple-post-expiry.zip \
              --title "Simple Post Expiry $GITHUB_REF_NAME" \
              --generate-notes
          fi
